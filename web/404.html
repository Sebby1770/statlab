<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StatLab — signal lost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0e1110;
        --paper: #e7e1d4;
        --copper: #c4843a;
        --phosphor: #c6f35a;
        --teal: #2f6f6a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(47, 111, 106, 0.2) 31px 32px),
          var(--ink);
        color: var(--paper);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-family: Syne, sans-serif;
        font-size: clamp(3rem, 12vw, 6rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--phosphor);
        margin: 0;
      }
      p {
        color: var(--copper);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      a {
        color: var(--ink);
        background: var(--phosphor);
        text-decoration: none;
        padding: 0.6rem 1rem;
        display: inline-block;
        margin-top: 1rem;
        font-weight: 600;
      }
      a:focus {
        outline: 2px solid var(--paper);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Signal lost on this channel</p>
      <a href="./index.html">Return to the desk</a>
    </main>
  </body>
</html>
